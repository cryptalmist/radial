plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Mixin refmaps are generated automatically by ModDevGradle
// for the configs listed in neoforge.mods.toml.

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // Optional at runtime: config screen (YACL) and MaLiLib hotkey slots (MaFgLib).
    // compileOnly + runtimeOnly = available while developing, never bundled or required.
    compileOnly "maven.modrinth:yet_another_config_lib_v3:${project.yacl_version}"
    runtimeOnly "maven.modrinth:yet_another_config_lib_v3:${project.yacl_version}"

    compileOnly "maven.modrinth:mafglib:${project.mafglib_version}"
    runtimeOnly "maven.modrinth:mafglib:${project.mafglib_version}"
}

processResources {
    def replaceProperties = [mod_version: project.mod_version]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
